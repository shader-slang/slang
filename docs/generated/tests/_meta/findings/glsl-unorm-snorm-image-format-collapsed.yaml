title: "GLSL: unorm and snorm storage images both emit layout(rgba32f)"
observed_at: "2026-08-05T00:00:00+00:00"
scope: glsl
evidence:
  command: "build/RelWithDebInfo/bin/slangc docs/generated/tests/design/ast-reference/modifiers/unorm-snorm-resource-format-emits-on-hlsl.slang -target glsl -entry main -stage compute"
  source_slang: docs/generated/tests/design/ast-reference/modifiers/unorm-snorm-resource-format-emits-on-hlsl.slang
  observed_summary: |
    `RWTexture2D<unorm float4>` and `RWTexture2D<snorm float4>` declared in the same module
    emit as the identical GLSL image uniform, both carrying `layout(rgba32f)`:
      layout(rgba32f) layout(binding = 0) uniform image2D uTex_0;
      layout(rgba32f) layout(binding = 1) uniform image2D sTex_0;
    Compiling the same file with `-target spirv-asm` does keep the two apart --
    `OpTypeImage %float 2D 2 0 0 2 Rgba8` for the unorm texture and
    `OpTypeImage %float 2D 2 0 0 2 Rgba8Snorm` for the snorm one -- so the two Khronos
    paths disagree about the format the same declaration selects, and the GLSL one also
    disagrees about the component width (rgba32f vs Rgba8).
  exit_code: 0
expected:
  claim: |
    The GLSL and direct-SPIR-V paths should record the same storage-image format for the
    same declaration, so `unorm float4` and `snorm float4` should emit distinct GLSL format
    qualifiers (`rgba8` and `rgba8_snorm`) rather than collapsing onto `rgba32f`.
