schema_version: 1
id: glsl-mesh-shading-rate-block-member-type
bundle: coverage/legalize
suspected_kind: wrong-codegen
title: "Mesh SV_ShadingRate redeclares gl_PrimitiveShadingRateEXT as uint not int"
observed_at: "2026-08-05T00:00:00+00:00"
scope: glsl
evidence:
  command: "build/RelWithDebInfo/bin/slangc /tmp/cand/mesh.slang -target spirv -emit-spirv-via-glsl -entry main -stage mesh -o /tmp/cand/m.spv"
  source_slang: docs/generated/tests/coverage/legalize/mesh-shader-output-block-glsl.slang
  observed_summary: |
    A mesh shader whose per-primitive output struct carries `uint rate : SV_ShadingRate`
    emits a `gl_MeshPerPrimitiveEXT` block redeclaration whose gl_PrimitiveShadingRateEXT
    member is `uint`, while GLSL declares that builtin as `int`:

      perprimitiveEXT out gl_MeshPerPrimitiveEXT
      {
          int gl_PrimitiveID;
          int gl_Layer;
          int gl_ViewportIndex;
          bool gl_CullPrimitiveEXT;
          uint gl_PrimitiveShadingRateEXT;     // <-- should be int
      } gl_MeshPrimitivesEXT[1U];

    glslang rejects the redeclaration:

      glslang: <file>(7): error : 'gl_PrimitiveShadingRateEXT' : cannot redeclare block
      member with a different type

    The `sv_shadingrate` branch of `getGLSLSystemValueInfo`
    (slang-ir-glsl-legalize.cpp:952) sets only `name`, never a `requiredType`, unlike
    the neighbouring `sv_rendertargetarrayindex` and `sv_viewportarrayindex` branches
    which set `requiredType = int` and therefore emit the right member type. The
    native SPIR-V arm is unaffected; the same shader compiles and validates as SPIR-V.
  exit_code: 0
  stderr_tail: "glslang:  <file>(7): error :  'gl_PrimitiveShadingRateEXT' : cannot redeclare block member with a different type"
expected:
  claim: |
    The GLSL legalizer should record `requiredType = int` for SV_ShadingRate on the
    output side (gl_PrimitiveShadingRateEXT), as it already does for gl_Layer and
    gl_ViewportIndex, so the emitted block redeclaration matches GLSL's declared type
    for the builtin.
  citation_kind: sibling-test
  citation: tests/pipeline/rasterization/mesh/output-qualifiers.slang
provenance:
  agent_model: claude-opus-5[1m]
  source_commit: 5634a0ea1b
  doc_anchor: docs/generated/design/pipeline/05-ir-passes.md#entry-point-and-parameter-handling
agent_self_assessment:
  confidence: high
  alternatives_considered:
    - "Test bug: ruled out — dropping only the SV_ShadingRate field makes the same mesh shader round-trip through glslang cleanly."
    - "glslang being over-strict: ruled out — the GL_EXT_mesh_shader block declares gl_PrimitiveShadingRateEXT as int, and Slang already narrows the neighbouring uint HLSL semantics to int for exactly this reason."
