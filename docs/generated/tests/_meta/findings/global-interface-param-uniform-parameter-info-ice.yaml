agent_self_assessment:
  confidence: medium
  alternatives_considered:
    - "Test bug (bad -conformance spelling): ruled out — the identical flags compile cleanly once the parameter is wrapped in ConstantBuffer<>, and the sequential-ID form matches the sibling test."
    - "Deliberately unsupported declaration form: plausible, and in that case the correct behaviour is still a located diagnostic rather than an InternalError."
    - "Missing [anyValueSize]: ruled out — the abort reproduces both with and without the attribute."
