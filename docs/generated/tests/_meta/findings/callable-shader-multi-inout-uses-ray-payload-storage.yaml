schema_version: 1
id: callable-shader-multi-inout-uses-ray-payload-storage
bundle: coverage/legalize
suspected_kind: wrong-codegen
title: "Callable shader with two inout params consolidates into IncomingRayPayloadKHR"
observed_at: "2026-08-05T00:00:00+00:00"
scope: spirv
evidence:
  command: "SLANG_RUN_SPIRV_VALIDATION=1 build/RelWithDebInfo/bin/slangc /tmp/cand/rt.slang -target spirv -entry callMain -stage callable -o /tmp/cand/rt.spv"
  source_slang: docs/generated/tests/coverage/legalize/raytracing-multi-payload-consolidation-spirv.slang
  observed_summary: |
    A callable shader with more than one `inout` varying parameter produces SPIR-V that
    fails validation, because the consolidated parameter struct is placed in the
    IncomingRayPayloadKHR storage class regardless of stage:

      struct Payload { float4 color; };
      struct Extra   { uint hits; };
      [shader("callable")]
      void callMain(inout Payload p, inout Extra e) { ... }

      error: line 36: OpEntryPoint Entry Point <id> '2[%callMain]'s callgraph contains
      function <id> '2[%callMain]', which cannot be used with the current execution model:
      [VUID-StandaloneSpirv-IncomingRayPayloadKHR-04699] IncomingRayPayloadKHR Storage
      Class is limited to AnyHitKHR, ClosestHitKHR, and MissKHR execution model

    `consolidateParameters` (slang-ir-glsl-legalize.cpp:3040) hardcodes
    `AddressSpace::IncomingRayPayload` and `addVulkanRayPayloadDecoration` for the
    merged variable; there is no branch on the entry point's stage. The same source
    compiled as `-stage closesthit` validates cleanly, so only the callable (and
    presumably intersection / raygeneration) stages are affected.
  exit_code: 0
  stderr_tail: "[VUID-StandaloneSpirv-IncomingRayPayloadKHR-04699] IncomingRayPayloadKHR Storage Class is limited to AnyHitKHR, ClosestHitKHR, and MissKHR execution model"
expected:
  claim: |
    For a callable shader the consolidated inout-parameter struct should be placed in
    the IncomingCallableDataKHR storage class (with the matching callable-payload
    decoration), the way a single `inout` parameter of a callable shader already is,
    rather than in IncomingRayPayloadKHR.
  citation_kind: sibling-test
  citation: tests/vkray/callable.slang
provenance:
  agent_model: claude-opus-5[1m]
  source_commit: 5634a0ea1b
  doc_anchor: docs/generated/design/target-pipelines/spirv.md#legalizeentrypointsforglsl-despite-the-name
agent_self_assessment:
  confidence: high
  alternatives_considered:
    - "Multiple inout params on a callable shader being invalid input: possible, but then the compiler should diagnose it rather than emit SPIR-V that fails validation."
    - "Test bug: ruled out — the identical two-parameter shape on -stage closesthit produces valid SPIR-V, so the source shape itself is accepted by the front end."
