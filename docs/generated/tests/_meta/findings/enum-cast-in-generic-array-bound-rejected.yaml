  alternatives_considered:
    - "Test bug: partly — the test is the only place this surface is exercised, but the construct is not obviously invalid, and the identical expression outside a generic array bound compiles, so the inconsistency is in the compiler rather than the test."
    - "Intentional restriction on what may appear in a generic array bound: possible, but then the diagnostic is the wrong one — `expected a function, got 'typeof(Size)'` describes a name-resolution outcome, not a restriction, and gives no indication that enum construction is disallowed here."
