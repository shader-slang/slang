agent_self_assessment:
  confidence: medium
  alternatives_considered:
    - "Dump artifact rather than real duplication: ruled out -- for kind 26 a StaticRequirementDecoration is interleaved between the two copies, which a repeated print of one decoration could not produce."
    - "Two distinct keys printing adjacently: ruled out -- both decoration lines precede a single 'let %N = builtinRequirementKey(...)' line, and the dump prints an inst's decorations immediately before it."
    - "Guard works but something later clones decorations onto the shared key: plausible and not excluded here. The duplication is already present in the first LOWER-TO-IR snapshot, which narrows the producer to lowering, but the precise second writer was not identified -- addBuiltinRequirementDecoration has exactly one caller, so a decoration-copying path (rather than a second add) is the more likely mechanism."
    - "Harmless cosmetic issue: not assumed. Consumers scan for the role decoration (autodiff's getInterfaceEntryByBuiltinRequirement); a duplicate is at best redundant work and at worst a double-visit, and it blocks any CHECK-NEXT assertion against the key."
