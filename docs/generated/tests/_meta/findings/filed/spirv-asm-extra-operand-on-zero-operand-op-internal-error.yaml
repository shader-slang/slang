title: "spirv_asm: extra operand on a zero-operand opcode aborts with InternalError"
observed_at: "2026-08-05T00:00:00+00:00"
scope: spirv
evidence:
  command: "build/RelWithDebInfo/bin/slangc -target spirv -entry test -stage compute <file> -o /tmp/o.spv"
  repro_source: |
    [numthreads(1,1,1)]
    void test() { spirv_asm { OpNop %x; }; }
  source_slang: docs/generated/tests/coverage/check-expr/spirv-asm-not-enough-operands-diag.slang
  observed_summary: |
    Writing an operand after a SPIR-V opcode that takes no operands emits the expected
    "too many operands" warning and then aborts the compile with an internal error instead
    of finishing with a normal diagnostic. The whole input is:
      [numthreads(1,1,1)]
      void test() { spirv_asm { OpNop %x; }; }
    Output:
      warning[E29106]: too many operands
        ^^^^^ too many operands for OpNop (expected max 0), did you forget a semicolon?
      note 99999: an internal error threw an exception while working on code near this location
      error[E99997]: Slang compilation aborted due to an exception of
        N5Slang13InternalErrorE unexpected: ErrorType
    Removing the stray operand (`spirv_asm { OpNop; };`) compiles cleanly, so the operand
    is the only difference. Note the process still exits 0 despite the abort message.
  exit_code: 0
  stderr_tail: "error[E99997]: Slang compilation aborted due to an exception of N5Slang13InternalErrorE unexpected: ErrorType"
expected:
  claim: |
    A `spirv_asm` instruction written with more operands than the opcode accepts should be
    reported with a user-facing diagnostic and the compile should stop cleanly, exactly as
    the sibling case in tests/language-feature/spirv-asm/too-many-operands.slang does for
    OpLoad; it should not throw an InternalError out of the compiler.
  citation_kind: sibling-test
  citation: tests/language-feature/spirv-asm/too-many-operands.slang
