id: getstringhash-nonliteral-argument-sigsegv
bundle: design/ir-reference/misc
suspected_kind: sigsegv
title: "getStringHash on a non-literal String segfaults instead of E41023"
observed_at: "2026-08-04T00:00:00+00:00"
scope: diagnostics
evidence:
  command: "build/RelWithDebInfo/bin/slangc docs/generated/tests/design/ir-reference/misc/string-hash-non-literal-diagnostic.slang -target hlsl -entry main -stage compute"
  source_slang: docs/generated/tests/design/ir-reference/misc/string-hash-non-literal-diagnostic.slang
  observed_summary: |
    Passing a `String` that does not fold to a literal into `getStringHash` kills slangc
    with SIGSEGV (exit 139, no diagnostic output at all) instead of reporting the
    documented "getStringHash requires string literal" error. Observed with a run-time
    selected literal:
      uniform int sel;
      String s = sel > 0 ? "aaa" : "bbb";
      outputBuffer[0] = getStringHash(s);
    The crash reproduces on `-target hlsl` and `-target spirv-asm`, with the selection
    written as a ternary, as an `if` assignment, and when the value is passed through a
    helper function's `String` parameter. Removing the `getStringHash` call while keeping
    the same run-time-selected `String` compiles cleanly (exit 0), so the crash is on the
    string-hash path rather than in `String` handling generally.
  exit_code: 139
  stderr_tail: "(process killed by SIGSEGV; no diagnostic output)"
expected:
  claim: |
    misc.md#getstringhash states that `checkGetStringHashInsts` enforces the literal-operand
    restriction, "reporting `Diagnostics::GetStringHashMustBeOnStringLiteral` for an operand
    that did not fold to a literal". A non-literal argument must therefore produce that
    diagnostic (error code E41023) and a clean non-zero exit, not a segfault.
  citation_kind: doc
  citation: docs/generated/design/ir-reference/misc.md
