schema_version: 1
id: metal-wgsl-return-position-depth-semantic-dropped
bundle: design/cross-cutting/ir-instructions
suspected_kind: wrong-codegen
title: "Metal/WGSL drop SV_Depth* in return position and emit a color attachment"
observed_at: "2026-08-05T00:00:00+00:00"
scope: metal
evidence:
  command: "build/RelWithDebInfo/bin/slangc docs/generated/tests/design/cross-cutting/ir-instructions/decoration-glsl-frag-depth-greater-emit.slang -target metal -stage fragment -entry main"
  source_slang: docs/generated/tests/design/cross-cutting/ir-instructions/decoration-glsl-frag-depth-greater-emit.slang
  observed_summary: |
    A fragment entry point that carries a depth system-value semantic in *return position*
    has that semantic silently discarded on the Metal and WGSL targets; the depth value is
    emitted as color attachment 0 instead of as the depth output.
      uniform float d;
      float main() : SV_DepthGreaterEqual { return d; }
    Metal emits
      struct pixelOutput_0 { float output_0 [[color(0)]]; };
    and WGSL emits
      struct pixelOutput_0 { @location(0) output_0 : f32, };
    Both compile with exit code 0 and no diagnostic. The same source on the other targets
    honours the semantic: HLSL keeps `float main() : SV_DEPTHGREATEREQUAL`, GLSL emits
    `layout(depth_greater) out float gl_FragDepth`, and SPIR-V emits
    `OpExecutionMode %main DepthReplacing` + `OpExecutionMode %main DepthGreater`.
    Moving the identical semantic onto a struct field of the fragment return type makes both
    targets handle it correctly - Metal emits `float depth_0 [[depth(greater)]]` and (for the
    plain `SV_Depth` spelling) WGSL emits `@builtin(frag_depth)` - so the drop is specific to
    the return-position spelling, not to the semantic. Plain `SV_Depth` in return position is
    dropped the same way on both targets, so this is not limited to the conservative-depth
    variants.
  exit_code: 0
expected:
  claim: |
    A depth system-value semantic written in return position must reach the emitted Metal /
    WGSL fragment output as the depth output (`[[depth(any|greater|less)]]` in MSL,
    `@builtin(frag_depth)` in WGSL), exactly as the struct-field spelling of the same
    semantic already does. If a target genuinely cannot express the semantic in that
    position, the compiler must diagnose it rather than reinterpret a depth write as a
    color-attachment write.
