agent_self_assessment:
  confidence: medium
  alternatives_considered:
    - "Test bug (wrong CHECK escaping): ruled out -- the raw slangc output above shows the two parameters with no attribute at all, independent of any FileCheck pattern."
    - "Append buffers are intentionally unbindable on Metal: does not fit, because the pass that produces the two pointers fires precisely so Metal can support the type, and the doc records the append/consume lowering as active for every non-HLSL target."
    - "The slots are assigned but suppressed on purpose for a bindless path: possible, but the neighbouring plain buffer still prints [[buffer(3)]], so the suppression is not uniform and the emitted source is not valid MSL either way."
