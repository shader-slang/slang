schema_version: 1
id: ptraccesschain-function-storage-missing-capability
bundle: conformance/types-pointer
suspected_kind: wrong-codegen
title: "[spirv] OpPtrAccessChain on a Function-storage pointer declares no capability"
observed_at: "2026-09-12T00:00:00+00:00"
scope: emit
evidence:
  command: "SLANG_RUN_SPIRV_VALIDATION=1 build/Release/bin/slangc -target spirv-asm -entry main -stage compute repro.slang"
  source_slang: docs/generated/tests/conformance/types-pointer/pointer-arithmetic-spirv-emission.slang
  observed_summary: |
    Pointer arithmetic with a runtime offset on a function-local array emits
    `OpPtrAccessChain` into a module whose only capability is `Shader`, so
    spirv-val rejects it. A ten-line shader reproduces:

      RWStructuredBuffer<int> inputBuf;
      RWStructuredBuffer<int> outBuf;
      [shader("compute")][numthreads(1,1,1)]
      void main()
      {
          int arr[8];
          for (int i = 0; i < 8; i++) arr[i] = i;
          int* p = &arr[0];
          p = p + inputBuf[4];   // runtime offset
          outBuf[0] = *p;
      }

    Validation fails with:

      error: line 82: Opcode PtrAccessChain requires one of these
      capabilities: Addresses VariablePointersStorageBuffer
      VariablePointers PhysicalStorageBufferAddresses

    and the emitted header declares only `OpCapability Shader`. slangc then
    reports E99999 and produces no output.

    Without `SLANG_RUN_SPIRV_VALIDATION=1` the invalid module is emitted
    silently and the test passes, which is why this looked like a
    host-dependent flake rather than a codegen bug.
expected:
  claim: |
    A module containing `OpPtrAccessChain` must declare one of the capabilities
    the opcode requires. The emitter does this in
    `requireVariableBufferCapabilityIfNeeded`
    (source/slang/slang-emit-spirv.cpp:12038), but it selects the capability by
    address space and only handles two:

      case AddressSpace::StorageBuffer: -> VariablePointersStorageBuffer
      case AddressSpace::GroupShared:   -> VariablePointers

    `emitGetOffsetPtr` (:8753) calls that helper and then emits
    `OpPtrAccessChain` unconditionally. A pointer into a function-local array
    is `AddressSpace::Function`, which matches neither case, so the switch
    falls through without declaring anything while the opcode is emitted
    anyway. The capability requirement belongs to the opcode, so the guard
    should be driven by the emission site rather than by an address-space
    allow-list.

    The design doc states exactly this principle for the emitter's other
    capability decisions: capabilities "not implied by the target profile ...
    are requested by the emitter when it sees a particular construct", and the
    `ImageGatherExtended` example shows the request attached to the branch that
    emits the operand needing it. `OpPtrAccessChain` is the same shape of
    obligation attached the wrong way round.

    Choosing the replacement needs care rather than declaring a capability
    unconditionally: the surrounding comments record a graphics-driver
    miscompile (shader-slang/slang#9061) caused by pulling `VariablePointers`
    into modules that did not need it, which is why the current code is
    conservative in the first place.
  citation_kind: doc
  citation: docs/generated/design/target-pipelines/spirv.md#capabilities-and-extensions-decided-at-emit-time
provenance:
  agent_model: claude-opus-5[1m]
  source_commit: cca8f23cec
  doc_anchor: docs/generated/design/target-pipelines/spirv.md
agent_self_assessment:
  confidence: high
  alternatives_considered:
    - "Environment/spirv-val version difference: ruled out. The failure reproduces on this host the moment validation is enabled, and the emitted module genuinely lacks any of the four listed capabilities -- it is not a validator strictness difference."
    - "Test bug (bad CHECK): ruled out. `OpPtrAccessChain` is emitted and the CHECK would match; the test fails only because validation aborts compilation before output is produced."
    - "Front-end should reject runtime-offset pointer arithmetic on a Function-storage array instead: possible, and would make this unreachable rather than fixing the capability logic. Not assumed -- the same arithmetic is legal and wanted on CPU/CUDA, where the sibling CHECKs pass, so rejecting it outright would regress those targets."
    - "Declaring `Addresses` unconditionally: rejected as the fix direction. `Addresses` is a kernel-mode capability; the shader-appropriate choice is one of the VariablePointers pair, and the surrounding comments record a real driver miscompile (#9061) from declaring `VariablePointers` more widely than needed, so the fix needs care about which capability is chosen."
