schema_version: 1
id: glsl-legalize-extension-name-missing-gl-prefix
bundle: coverage/legalize
suspected_kind: wrong-codegen
title: "SV_StencilRef / SV_CullDistance emit #extension without the GL_ prefix"
observed_at: "2026-08-05T00:00:00+00:00"
scope: glsl
evidence:
  command: "build/RelWithDebInfo/bin/slangc /tmp/cand/frag-sysvals.slang -target glsl -entry main -stage fragment"
  source_slang: docs/generated/tests/coverage/legalize/fragment-coverage-depth-glsl.slang
  observed_summary: |
    Two branches of `getGLSLSystemValueInfo` request a GLSL extension by a name that
    is missing the mandatory `GL_` prefix, so the emitted `#extension` line is not a
    legal GLSL extension name and glslang rejects the shader.

      slang-ir-glsl-legalize.cpp:537  requireGLSLExtension("ARB_cull_distance")
      slang-ir-glsl-legalize.cpp:814  requireGLSLExtension("ARB_shader_stencil_export")

    A fragment shader with a `uint stencil : SV_StencilRef` output emits:

      #version 450
      #extension ARB_shader_stencil_export : require

    and a vertex shader with `float cull[2] : SV_CullDistance` emits:

      #version 450
      #extension ARB_cull_distance : require

    Round-tripping either through glslang (slangc -target spirv -emit-spirv-via-glsl)
    fails:

      glslang: (2): error : '#extension' : extension not supported: ARB_shader_stencil_export
      glslang: (2): error : '#extension' : extra tokens -- expected newline
      glslang: (2): error : '' : compilation terminated

    Every other `requireGLSLExtension` call in the same file passes a `GL_`-prefixed
    name; these two are the only exceptions. The SPIR-V arm is unaffected (it emits
    `OpExtension "SPV_EXT_shader_stencil_export"` and validates cleanly), so only
    text-GLSL output is broken.
  exit_code: 0
  stderr_tail: "glslang:  (2): error :  '#extension' : extension not supported: ARB_shader_stencil_export"
expected:
  claim: |
    The GLSL legalizer should request these extensions as `GL_ARB_shader_stencil_export`
    and `GL_ARB_cull_distance`, matching every other extension request in the same
    function, so the emitted `#extension` directive is a legal GLSL extension name.
  citation_kind: sibling-test
  citation: tests/glsl/fragment-depth-greater-less.slang
provenance:
  agent_model: claude-opus-5[1m]
  source_commit: 5634a0ea1b
  doc_anchor: docs/generated/design/target-pipelines/spirv.md#legalizeentrypointsforglsl-despite-the-name
agent_self_assessment:
  confidence: high
  alternatives_considered:
    - "Test bug: ruled out — the same shader minus the SV_StencilRef / SV_CullDistance field round-trips through glslang cleanly; adding the field alone introduces the bad directive."
    - "glslang being over-strict: ruled out — GLSL extension names are required to begin with GL_, and the sibling test tests/glsl/fragment-depth-greater-less.slang pins the prefixed spelling for a neighbouring semantic from the same emitter."
