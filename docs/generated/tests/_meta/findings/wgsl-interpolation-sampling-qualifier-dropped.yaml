agent_self_assessment:
  confidence: medium
  alternatives_considered:
    - "Deliberate: WGSL cannot express the qualifier — ruled out, WGSL's @interpolate takes an optional sampling argument (`centroid`, `sample`) alongside the interpolation type."
    - "Test bug: ruled out — the same struct produces the correct qualifier on GLSL, SPIR-V and HLSL, and the guard that drops the sampling-only case is visible directly in slang-emit-wgsl.cpp."
    - "Harmless because WGSL's default already matches: ruled out for `centroid`/`sample` (the default is centre, not centroid or per-sample) and for `linear` (WGSL `linear` is explicitly non-perspective)."
