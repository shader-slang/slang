# Manifest mapping each generated document to its prompt, watched source
# paths, dependencies, and size cap. Consumed by _meta/regenerate.py.
#
# Schema: _meta/schema/manifest.schema.json
#
# Conventions:
#   - watched_paths globs are workspace-relative.
#   - Globs use shell-style wildcards (*, **, ?). They are expanded at the
#     current commit when computing the freshness digest.
#   - depends_on lists other generated docs whose output is used as input
#     context for the agent generating this doc (Phase 3 cross-linking).
#   - size_cap_bytes is a soft cap; the lint pass warns above it.

version: 1
default_size_cap_bytes: 32768

documents:
  # --- architecture/ -----------------------------------------------------

  architecture/overview.md:
    prompt: prompts/architecture-overview.md
    # The prompt asks the page to anchor each subsystem bullet in a real file,
    # but the watched set used to cover only source/slang plus the two core
    # CMakeLists, so the sibling subprojects the page describes could be
    # renamed or gutted without the page ever going stale. One representative
    # per subproject is enough to catch that: these are the files whose
    # existence the corresponding bullet asserts.
    watched_paths:
      - source/slang/CMakeLists.txt
      - source/slang/slang-compile-request.h
      - source/slang/slang-compile-request.cpp
      - source/slang/slang-module.h
      - source/slang/slang-module.cpp
      - source/core/CMakeLists.txt
      - source/compiler-core/CMakeLists.txt
      - source/slangc/main.cpp
      - source/slang-llvm/slang-llvm.cpp
      - source/slang-glslang/slang-glslang.cpp
      - source/slang-dispatcher/main.cpp
      - source/slang-wasm/slang-wasm-bindings.cpp
      - source/slang-record-replay/replay-context.cpp
      - source/slang-rt/CMakeLists.txt
      - include/slang.h
      - CLAUDE.md
    depends_on: []
    size_cap_bytes: 16384

  architecture/module-map.md:
    prompt: prompts/architecture-module-map.md
    # The module map is a file-level inventory of every logical unit under
    # source/, so it watches each subproject's CMakeLists plus its top-level
    # *.h / *.cpp sources. source/*/*.{h,cpp} covers the sibling subprojects
    # (slangc, slang-llvm, slang-glslang, slang-dispatcher, slang-rt,
    # slang-record-replay, slang-wasm, ...) whose representative files the
    # table cites, and subsumes the narrower source/{slang,compiler-core,
    # core}/slang-* globs it replaces.
    watched_paths:
      - source/*/CMakeLists.txt
      - prelude/*.h
      - source/*/*.h
      - source/*/*.cpp
    depends_on:
      - architecture/overview.md
    size_cap_bytes: 32768

  architecture/dependency-graph.md:
    prompt: prompts/architecture-dependency-graph.md
    watched_paths:
      - source/*/CMakeLists.txt
    depends_on:
      - architecture/module-map.md
    size_cap_bytes: 16384

  # --- pipeline/ ---------------------------------------------------------

  pipeline/overview.md:
    prompt: prompts/pipeline-overview.md
    # slang-code-gen.cpp owns emitEntryPoints / _emitEntryPoints, which is the
    # real per-target dispatch: slang-emit.cpp only builds the C-like source
    # emitters, while SPIR-V, DXIL, metallib, PTX, LLVM and HostVM are routed
    # from slang-code-gen.cpp. Leaving it unwatched is what let this page keep
    # crediting emitEntryPointsSourceFromIR with selecting every backend.
    watched_paths:
      - source/slang/slang-compile-request.cpp
      - source/slang/slang-compile-request.h
      - source/slang/slang-code-gen.cpp
      - source/slang/slang-emit.cpp
      - source/slang/slang-lower-to-ir.cpp
      - source/slang/slang-check.cpp
      - source/slang/slang-parser.cpp
      - source/slang/slang-preprocessor.cpp
      - source/compiler-core/slang-lexer.cpp
    depends_on:
      - architecture/overview.md
    size_cap_bytes: 24576

