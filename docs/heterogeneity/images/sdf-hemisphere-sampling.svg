<svg xmlns="http://www.w3.org/2000/svg" width="640" height="425" viewBox="0 0 640 425" role="img" aria-labelledby="title description">
<title id="title">Two ways to choose directions</title>
<desc id="description">Two cross-sections of the hemisphere above a surface point. On the left, uniform sampling has the same density in every direction, drawn as a half disc, and its sample directions spread down to the tangent plane. On the right, cosine-weighted sampling has density cos theta over pi, drawn as a disc touching the point, and its sample directions gather near the normal.</desc>
