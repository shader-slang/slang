<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" role="img" aria-labelledby="title description">
<title id="title">A smooth union rounds the join</title>
<desc id="description">Zero contours of two unit spheres centred at x equals minus and plus 0.9. The ordinary union has a crease where the circles intersect. The smooth union with blend width 0.6 expands and rounds that join. Dashed circles show the same input spheres in both views.</desc>
