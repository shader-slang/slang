<title id="title">Where reflected light comes from</title>
<desc id="description">Two cross-sections through a surface point, with the view direction 45 degrees to the left of the normal. Each shaded lobe shows how much light arriving from each direction reaches the viewer, the BRDF times the cosine. The matte Lambertian lobe is a round disc around the normal. The glossy GGX lobe, with roughness 0.35, is a narrow lobe around the mirror direction on the right.</desc>
