<path d="M 100.00,375.00 L 330.00,375.00" stroke="#b25b2b" stroke-width="2" fill="none"/>
<text x="215" y="400" fill="#b25b2b" font-size="20" font-weight="400" text-anchor="middle">focalLength</text>
<text x="320" y="434" fill="#5b6d62" font-size="18" font-weight="400" text-anchor="middle">A longer focalLength narrows the view.</text>
</g>
</svg>
