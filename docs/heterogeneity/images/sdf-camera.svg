<text x="330" y="100" fill="#b25b2b" font-size="18" font-weight="400" text-anchor="middle">virtual image plane</text>
<path d="M 100.00,230.00 L 550.00,230.00" stroke="#9baa9e" stroke-width="1" fill="none" stroke-dasharray="6 6"/>
<path d="M 100.00,230.00 L 500.00,230.00" stroke="#387044" stroke-width="2" fill="none" marker-end="url(#normal)"/>
<text x="430" y="260" fill="#387044" font-size="18" font-weight="400" text-anchor="middle">forward</text>
<circle cx="550" cy="230" r="5" fill="#387044" stroke="#fafcf9" stroke-width="2"/>
<text x="550" y="211" fill="#387044" font-size="20" font-weight="400" text-anchor="middle">target</text>
<path d="M 100.00,230.00 L 570.00,117.61" stroke="#286c9b" stroke-width="3" fill="none" marker-end="url(#outgoing)"/>
<circle cx="330" cy="175" r="5" fill="#286c9b" stroke="#fafcf9" stroke-width="2"/>
<text x="490" y="108" fill="#286c9b" font-size="18" font-weight="400" text-anchor="middle">camera ray</text>
<path d="M 330.00,175.00 L 352.00,191.00" stroke="#286c9b" stroke-width="1" fill="none"/>
<text x="359" y="204" fill="#286c9b" font-size="18" font-weight="400" text-anchor="start">pixel sample</text>
