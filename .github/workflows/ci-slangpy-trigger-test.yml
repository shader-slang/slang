name: CI SlangPy Trigger Test

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Triggers SlangPy CI to test against SlangPy tip-of-tree.
# Uses pull_request_target so secrets are available for fork PRs.
# This workflow only dispatches metadata (PR number, SHA, fork status)
# and never checks out or executes PR code.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Slang PR number to test against SlangPy"
        required: true
        type: string
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [master]
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  # Names a SlangPy PR to merge into SlangPy `main` before SlangPy CI builds. Empty
  # means "no cherry-pick": every run tests against SlangPy `main` as-is, which is the
  # normal state.
  #
  # A Slang change that breaks SlangPy is a chicken-and-egg problem: until the matching
  # SlangPy PR lands, every Slang PR fails SlangPy CI. Setting this to that PR's number
  # asks SlangPy CI to merge it in before building, so both halves are tested together.
  # SlangPy CI owns the checkout (see ci-latest-slang.yml in shader-slang/slangpy).
  #
  # Setting this applies to every Slang PR, so keep the window short: land the SlangPy
  # PR right after the Slang one, then set this back to "".
  SLANGPY_CHERRY_PICK_PR: ""

jobs:
  filter:
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.draft != true) || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    outputs:
      should-run: ${{ steps.filter.outputs.should-run }}
    steps:
      - name: Determine PR number
        id: pr_number
        run: |
          echo "number=${{ github.event.pull_request.number || inputs.pr_number }}" >> "$GITHUB_OUTPUT"
      # A minimal checkout pinned to master, just to get the composite
      # action definition. This never touches PR/fork content: the ref is
      # explicit rather than relying on checkout's default (which for
      # pull_request_target does already resolve to the base branch).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.pr_number.outputs.number != ''
        with:
          ref: master
          sparse-checkout: .github/actions/docs-only-filter
      - name: List changed files
        id: changed_files
        if: steps.pr_number.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr_number.outputs.number }}
        run: |
          files="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: filter
        if: steps.pr_number.outputs.number != ''
        uses: ./.github/actions/docs-only-filter
        with:
          files: ${{ steps.changed_files.outputs.files }}

  trigger-slangpy-tests:
    needs: [filter]
    runs-on: ubuntu-latest
    if: needs.filter.outputs.should-run != 'false'

    steps:
      - name: Get PR info (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        id: pr_manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }})
          PR_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
          PR_IS_FORK=$(echo "$PR_JSON" | jq -r '.head.repo.fork')
          PR_HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name')
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title' | head -1 | cut -c1-80)
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
          {
            echo "number=${{ inputs.pr_number }}"
            echo "sha=$PR_SHA"
            echo "is_fork_pr=$PR_IS_FORK"
            echo "head_repo=$PR_HEAD_REPO"
            echo "title=$PR_TITLE"
            echo "author=$PR_AUTHOR"
          } >> "$GITHUB_OUTPUT"

      - name: Get PR info (automatic trigger)
        if: github.event_name == 'pull_request_target'
        id: pr_auto
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "number=${{ github.event.pull_request.number }}"
            echo "sha=${{ github.event.pull_request.head.sha }}"
            echo "is_fork_pr=${{ github.event.pull_request.head.repo.fork }}"
            echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
            # Use first line only; truncate to keep run-name readable
            echo "title=$(echo "$PR_TITLE" | head -1 | cut -c1-80)"
            echo "author=${{ github.event.pull_request.user.login }}"
          } >> "$GITHUB_OUTPUT"

      - name: Get PR info (merge queue)
        if: github.event_name == 'merge_group'
        id: pr_mq
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          QUEUE_REF="${{ github.event.merge_group.head_ref || github.ref_name }}"
          PR_NUMBER=$(echo "$QUEUE_REF" | sed -n 's|.*/pr-\([0-9]*\)-.*|\1|p')
          {
            echo "number=$PR_NUMBER"
            echo "sha=${{ github.event.merge_group.head_sha || github.sha }}"
            echo "ref=$QUEUE_REF"
            echo "checkout_mode=ref"
            echo "checkout_repo=${{ github.repository }}"
            echo "is_fork_pr=false"
            echo "head_repo=${{ github.repository }}"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
            {
              echo "title=$(echo "$PR_JSON" | jq -r '.title' | head -1 | cut -c1-80)"
              echo "author=$(echo "$PR_JSON" | jq -r '.user.login')"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post pending status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr_auto.outputs.sha || steps.pr_manual.outputs.sha || steps.pr_mq.outputs.sha }}',
              state: 'pending',
              context: 'SlangPy Tests',
              description: 'SlangPy tests queued...',
              target_url: 'https://github.com/shader-slang/slangpy/actions/workflows/ci-latest-slang.yml'
            });

      - name: Trigger SlangPy CI
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_TITLE: ${{ steps.pr_auto.outputs.title || steps.pr_manual.outputs.title || steps.pr_mq.outputs.title }}
        with:
          github-token: ${{ secrets.SLANGPY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'shader-slang',
              repo: 'slangpy',
              event_type: 'slang-pr-test',
              client_payload: {
                slang_pr_number: `${{ steps.pr_auto.outputs.number || steps.pr_manual.outputs.number || steps.pr_mq.outputs.number }}`,
                slang_commit_sha: `${{ steps.pr_auto.outputs.sha || steps.pr_manual.outputs.sha || steps.pr_mq.outputs.sha }}`,
                slang_ref: `${{ steps.pr_mq.outputs.ref || steps.pr_auto.outputs.sha || steps.pr_manual.outputs.sha }}`,
                slang_checkout_mode: `${{ steps.pr_mq.outputs.checkout_mode }}` || 'pr',
                slang_checkout_repo: `${{ steps.pr_mq.outputs.checkout_repo }}` || '${{ github.repository }}',
                // `client_payload` is capped at 10 top-level properties by the
                // repository-dispatch API, and the flat form was already at 10. These
                // three are informational only -- SlangPy CI reads none of them -- so
                // they are grouped here to keep the cap free for fields SlangPy acts
                // on. Nesting does not count against the cap.
                slang_pr_meta: {
                  is_fork_pr: `${{ steps.pr_auto.outputs.is_fork_pr || steps.pr_manual.outputs.is_fork_pr || steps.pr_mq.outputs.is_fork_pr }}`,
                  slang_pr_head_repo: `${{ steps.pr_auto.outputs.head_repo || steps.pr_manual.outputs.head_repo || steps.pr_mq.outputs.head_repo }}`,
                  slang_trigger_source: '${{ github.event_name }}'
                },
                slangpy_cherry_pick_pr: process.env.SLANGPY_CHERRY_PICK_PR || '',
                slang_pr_title: process.env.PR_TITLE || '',
                slang_pr_author: `${{ steps.pr_auto.outputs.author || steps.pr_manual.outputs.author || steps.pr_mq.outputs.author }}`
              }
            });

  mark-slangpy-tests-skipped:
    needs: [filter]
    runs-on: ubuntu-latest
    if: needs.filter.outputs.should-run == 'false'

    steps:
      - name: Post skipped status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER || '', 10);
            let sha = context.payload.pull_request?.head?.sha;

            if (!sha) {
              if (!Number.isInteger(prNumber)) {
                throw new Error('Unable to resolve PR number for docs-only SlangPy status.');
              }

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              sha = pr.head.sha;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'SlangPy Tests',
              description: 'Skipped for docs-only change.',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
