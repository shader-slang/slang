name: Nightly Slang Sanitizer Test

on:
  schedule:
    # Run nightly at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sanitizer:
        description: "Sanitizer jobs to run"
        type: choice
        options: [all, asan, tsan]
        default: all

jobs:
  sanitizer-nightly:
    if: github.event_name == 'schedule' || inputs.sanitizer != 'tsan'
    uses: ./.github/workflows/ci-slang-sanitizer.yml
    with:
      runs-on: '["ubuntu-22.04"]'
      # GitHub-hosted CPU runner. GPU-requiring tests are skipped (no GPU
      # available); this maximizes coverage of CPU, SPIRV-emit, and
      # diagnostic tests under sanitizer.
      server-count: 1
      timeout-minutes: 90
      upload-binaries: true
    secrets: inherit

  tsan-nightly:
    if: github.event_name == 'schedule' || inputs.sanitizer != 'asan'
    uses: ./.github/workflows/ci-slang-sanitizer.yml
    with:
      sanitizer: tsan
      runs-on: '["ubuntu-22.04"]'
      # Compiler unit tests create their own threads. Limit suite-level process
      # parallelism because TSan adds substantial memory overhead.
      server-count: 1
      timeout-minutes: 240
    secrets: inherit

  notify:
    needs: [sanitizer-nightly, tsan-nightly]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Success notification
        if: needs.sanitizer-nightly.result == 'success' && needs.tsan-nightly.result == 'success'
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "Sanitizer-Nightly": ":green-check-mark: Sanitizer nightly: ASan/UBSan and TSan clean (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SANITIZER_NIGHTLY_WEBHOOK_URL }}

      - name: Failure notification
        if: needs.sanitizer-nightly.result != 'success' || needs.tsan-nightly.result != 'success'
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "Sanitizer-Nightly": ":alert: Sanitizer nightly: ASan/UBSan ${{ needs.sanitizer-nightly.result }}, TSan ${{ needs.tsan-nightly.result }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SANITIZER_NIGHTLY_WEBHOOK_URL }}
