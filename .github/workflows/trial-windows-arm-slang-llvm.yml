name: Trial - native windows-11-vs2026-arm slang-llvm build

# Spike to determine whether slang-llvm (Slang's LLVM/Clang-backed JIT
# target) can be built natively for Windows ARM64. Follows the base
# native-build trial in PR #12657, which validated the plain
# slangc/slang-test build+run path on windows-11-vs2026-arm (that trial
# explicitly disabled LLVM via SLANG_SLANG_LLVM_FLAVOR=DISABLE).
#
# See issue #12675: slang-llvm is not built for windows/aarch64 anywhere
# in the release pipeline today (release.yml's build-slang-llvm matrix
# flag is only true for linux/x86_64, windows/x86_64, macos/aarch64).
# This workflow is step 1 toward filling that gap: confirm LLVM itself
# builds natively on this platform, then confirm the slang-llvm CMake
# target builds against it, before touching the release matrix.
#
# No prebuilt LLVM exists in the GCS cache (gs://slang-ci-cache) for the
# windows-aarch64 platform key, so setup-llvm-from-gcs will always fall
# through to building LLVM from source via external/build-llvm.sh
# (typically 20-40 minutes on other platforms) — this workflow does not
# upload to the cache (upload is gated on github.ref == master pushes in
# setup-llvm-from-gcs, which a workflow_dispatch on a feature branch
# never satisfies), consistent with the project rule that PRs/branches
# must never write to gs://slang-ci-cache.

on:
  workflow_dispatch:

concurrency:
  group: trial-windows-arm-slang-llvm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-slang-llvm:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          submodules: "recursive"

      - name: Add bash to PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"

      # See slang-win-visual-studio-util.cpp fix in #12657 (commit
      # 3a01d13d8): common-setup's msvc-dev-cmd step has no arch input and
      # would resolve HostX64\x64, not a native arm64 toolchain. Force
      # arch: arm64 explicitly here too.
      - name: Set up native arm64 MSVC dev tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          arch: arm64

      - name: Install Ninja
        run: choco install ninja

      - name: Report resolved cl.exe and cmake
        run: |
          where cl.exe
          cmake --version
          ninja --version

      - name: Setup LLVM (build from source, no windows-aarch64 GCS cache exists yet)
        uses: ./.github/actions/setup-llvm-from-gcs
        with:
          os: windows
          compiler: cl
          platform: aarch64
          llvm-hash: ${{ hashFiles('external/build-llvm.sh') }}
          build-if-missing: "true"
          github-token: ${{ github.token }}

      - name: Report LLVM install layout
        run: |
          ls -la "${LLVM_DIR}"
          find "${LLVM_DIR}" -iname "ClangConfig.cmake" -o -iname "LLVMConfig.cmake"

      - name: Configure CMake (default preset, USE_SYSTEM_LLVM, native arm64)
        run: |
          cmake --preset default --fresh \
            -DSLANG_SLANG_LLVM_FLAVOR=USE_SYSTEM_LLVM \
            -DSLANG_USE_SCCACHE=OFF \
            -DSLANG_ENABLE_CUDA=0 \
            -DLLVM_DIR="${LLVM_DIR}/lib/cmake/llvm" \
            -DClang_DIR="${Clang_DIR}/lib/cmake/clang"

      - name: Build slang-llvm
        run: cmake --build build --config Debug --target slang-llvm

      - name: Smoke test slang-llvm presence
        run: |
          bin_dir=$(pwd)/build/Debug/bin
          lib_dir=$(pwd)/build/Debug/lib
          if [[ ! -f "$bin_dir/slang-llvm.dll" && ! -f "$lib_dir/slang-llvm.dll" ]]; then
            echo "ERROR: expected slang-llvm.dll in $bin_dir or $lib_dir"
            ls -la "$bin_dir" || true
            ls -la "$lib_dir" || true
            exit 1
          fi
          echo "slang-llvm.dll built successfully"

      - name: Build slangc and slang-test against slang-llvm
        run: |
          cmake --build build --config Debug --target slangc
          cmake --build build --config Debug --target slang-test

      - name: Smoke test slangc -v (reports LLVM availability)
        run: |
          bin_dir=$(pwd)/build/Debug/bin
          "$bin_dir/slangc.exe" -v

      # -emit-cpu-via-llvm routes CPU/host-callable codegen through the
      # slang-llvm backend specifically (see
      # _extractReflectionTestRequirements in slang-test-main.cpp, which
      # tags any test using this flag as depending on SLANG_PASS_THROUGH_LLVM
      # and skips it if slang-llvm isn't available) — unlike the plain
      # `-cpu` target smoke-tested in #12657, which goes through the
      # downstream-cl.exe execution path, not slang-llvm's JIT.
      - name: Smoke test via slang-test (slang-llvm JIT backend)
        run: |
          bin_dir=$(pwd)/build/Debug/bin
          export PATH="$bin_dir:$PATH"
          "$bin_dir/slang-test.exe" tests/llvm/printf.slang
