name: Label Bot Items
# Issues and pull requests opened by the nv-slang-bot GitHub App get the
# `bot` label, so the default views can hide them (`-label:bot`) and human
# work stays visible. No checkout: the job only calls the issues API, so
# running on pull_request_target for fork PRs is safe.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    if: github.event.sender.login == 'nv-slang-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const number = context.payload.issue?.number ?? context.payload.pull_request?.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              labels: ['bot'],
            });
