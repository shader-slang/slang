name: BenchView upload integration test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on:
      labels: [Windows, X64, nvrgfx-perf-kernelvm-bridge]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          sparse-checkout: tools/compile-perf
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: shader-slang/slang-compile-perf
          path: perf-results
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"
      - name: Upload latest archived nightly and replay it
        shell: python
        env:
          BENCHVIEW_WRITE_KEY: ${{ secrets.BENCHVIEW_WRITE_KEY }}
          BENCHVIEW_URL: ${{ vars.BENCHVIEW_URL || 'http://rtrci.nvidia.com/benchview' }}
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, 'tools/compile-perf')
          import benchview
          directory = sorted(p.parent for p in pathlib.Path('perf-results/daily').glob('*/results.json'))[-1]
          meta = json.loads((directory / 'meta.json').read_text(encoding='utf-8'))
          meta['observed_at_basis'] = 'Archive date at UTC midnight; exact measurement time unknown'
          records = json.loads((directory / 'results.json').read_text(encoding='utf-8'))
          payloads = benchview.submissions(records, meta, 'Windows', meta['date'] + 'T00:00:00Z',
                                          'archive-' + directory.name)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / ('benchview-' + os.environ['GITHUB_RUN_ID'])
          output.mkdir(parents=True, exist_ok=True)
          key = os.environ['BENCHVIEW_WRITE_KEY']
          if not key:
              raise RuntimeError('BENCHVIEW_WRITE_KEY is missing')
          print('Archive:', directory.name, 'observations:', len(records))
          for i, payload in enumerate(payloads):
              (output / f'submission-{i}.json').write_bytes(benchview.encode(payload))
              benchview.submit(payload, os.environ['BENCHVIEW_URL'], key)
              print('Accepted batch', i + 1)
              benchview.submit(payload, os.environ['BENCHVIEW_URL'], key)
              print('Accepted identical replay', i + 1)
      - name: Archive submitted payloads
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: benchview-upload-test
          path: ${{ runner.temp }}/benchview-${{ github.run_id }}/
          if-no-files-found: warn
