name: BenchView release pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on:
      labels: [Windows, X64, nvrgfx-perf-kernelvm-bridge]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: shader-slang/slang-compile-perf
          ref: b09b0ea004d79340b726ae0865f994663b0864b9
          path: perf-results
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"
      - name: Submit three reviewed release payloads and replay
        shell: python
        env:
          BENCHVIEW_WRITE_KEY: ${{ secrets.BENCHVIEW_WRITE_KEY }}
          BENCHVIEW_URL: ${{ vars.BENCHVIEW_URL || 'http://rtrci.nvidia.com/benchview' }}
        run: |
          import json, os, pathlib, sys, hashlib
          sys.path.insert(0, 'tools/compile-perf')
          import benchview
          manifest = json.loads(pathlib.Path('.github/benchview-release-pilot.json').read_text())
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / ('benchview-' + os.environ['GITHUB_RUN_ID'])
          output.mkdir(parents=True, exist_ok=True)
          key = os.environ['BENCHVIEW_WRITE_KEY']
          if not key:
              raise RuntimeError('BENCHVIEW_WRITE_KEY is missing')
          prepared = []
          for release in manifest['releases']:
              tag = release['tag']
              records = json.loads((pathlib.Path('perf-results/releases') / tag / 'results.json').read_text())
              payloads = benchview.submissions(records, release['meta'], 'Windows', release['observed_at'],
                                              'archive-release-' + tag, release=release['release'])
              hashes = [hashlib.sha256(benchview.encode(p)).hexdigest() for p in payloads]
              if hashes != release['payload_sha256']:
                  raise RuntimeError('Payload differs from reviewed local export: ' + tag)
              for i, payload in enumerate(payloads):
                  (output / f'{tag}-{i}.json').write_bytes(benchview.encode(payload))
                  prepared.append((tag, payload))
          for tag, payload in prepared:
              url = os.environ['BENCHVIEW_URL']
              benchview.submit(payload, url, key, allow_insecure=url == 'http://rtrci.nvidia.com/benchview')
              print('Accepted', tag, len(payload['observations']), 'observations')
              benchview.submit(payload, url, key, allow_insecure=url == 'http://rtrci.nvidia.com/benchview')
              print('Accepted identical replay', tag)
      - name: Archive submission payloads
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: benchview-release-pilot
          path: ${{ runner.temp }}/benchview-${{ github.run_id }}/
          if-no-files-found: warn
