name: Nightly Slang VKGLCTS Test

on:
  workflow_dispatch:
  schedule:
    - cron: "00 07 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DISABLE_CTS_SLANG: 0
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true
  # The only place the CTS release/version is spelled out. Everything else
  # derives the download name and the extracted directory from this.
  CTS_PACKAGE: VK-GL-CTS_WithSlang-0.0.9-win64
jobs:
  build:
    strategy:
      matrix:
        include:
          # Self-hosted falcor tests
          - os: windows
            compiler: cl
            platform: x86_64
            config: release
            warnings-as-errors: true
            full-gpu-tests: false
            runs-on: [Windows, self-hosted, regression-test, vulkancts]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    permissions:
      id-token: write # Required for Workload Identity (GCS auth)
      contents: read
    env:
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: "true"
          fetch-depth: "0"
      # Authenticate to Google Cloud (skip for fork PRs - no id-token available)
      - name: Authenticate to Google Cloud
        if: env.IS_FORK_PR != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/125098404903/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-ci@slang-runners.iam.gserviceaccount.com"
      - name: Setup
        uses: ./.github/actions/common-setup
        with:
          os: ${{matrix.os}}
          compiler: ${{matrix.compiler}}
          platform: ${{matrix.platform}}
          config: ${{matrix.config}}
          build-llvm: true
      - name: Build Slang
        run: |
          # Prepare ccache launcher arguments if ccache is available
          cmake_launcher_defines=()
          if [[ -n "${ccache_symlinks_path:-}" ]]; then
            echo "🔧 Using ccache with launcher: ${ccache_symlinks_path}"
            echo "🔧 CCACHE_DIR is set to: ${CCACHE_DIR:-'not set'}"
            cmake_launcher_defines+=("-DCMAKE_C_COMPILER_LAUNCHER=${ccache_symlinks_path}")
            cmake_launcher_defines+=("-DCMAKE_CXX_COMPILER_LAUNCHER=${ccache_symlinks_path}")
          else
            echo "ℹ️  ccache_symlinks_path not set - building without ccache"
          fi
          cmake --preset default --fresh \
            -DSLANG_SLANG_LLVM_FLAVOR=USE_SYSTEM_LLVM \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=${{matrix.warnings-as-errors}} \
            -DSLANG_ENABLE_CUDA=1 \
            -DSLANG_ENABLE_EXAMPLES=0 \
            -DSLANG_ENABLE_GFX=1 \
            -DSLANG_ENABLE_TESTS=1 \
            "${cmake_launcher_defines[@]}"
          cmake --workflow --preset "${{matrix.config}}"
      - name: Resolve CTS paths
        run: |
          # Forward slashes work for pwsh, deqp-vk and upload-artifact alike.
          echo "CTS_ZIP=${{ github.workspace }}/${CTS_PACKAGE}.zip" >> "$GITHUB_ENV"
          echo "CTS_DIR=${{ github.workspace }}/${CTS_PACKAGE}" >> "$GITHUB_ENV"
      - uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          latest: true
          repository: "shader-slang/VK-GL-CTS"
          fileName: "${{ env.CTS_PACKAGE }}.zip"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: "shader-slang/VK-GL-CTS"
          sparse-checkout: |
            test-lists/slang-passing-tests.txt
            test-lists/slang-waiver-tests.xml
          path: test-lists
          sparse-checkout-cone-mode: false
      - name: vkcts setup
        shell: pwsh
        run: |
          Expand-Archive -Path $env:CTS_ZIP -DestinationPath $env:CTS_DIR

          copy ${{ github.workspace }}\build\Release\bin\slang-compiler.dll "${env:CTS_DIR}\slang-compiler.dll"
          copy ${{ github.workspace }}\build\Release\bin\slang-glslang.dll "${env:CTS_DIR}\slang-glslang.dll"
          copy ${{ github.workspace }}\build\Release\bin\slang-glsl-module.dll "${env:CTS_DIR}\slang-glsl-module.dll"
          copy ${{ github.workspace }}\build\Release\bin\test-server.exe "${env:CTS_DIR}\test-server.exe"

          copy ${{ github.workspace }}\test-lists\test-lists\slang-passing-tests.txt "${env:CTS_DIR}\slang-passing-tests.txt"
          copy ${{ github.workspace }}\test-lists\test-lists\slang-waiver-tests.xml "${env:CTS_DIR}\slang-waiver-tests.xml"

      - name: dump device info
        shell: pwsh
        working-directory: ${{ env.CTS_DIR }}
        run: |
          .\deqp-vk.exe --deqp-case=dEQP-VK.info.device
          Get-Content -Path TestResults.qpa

      - name: vkcts run
        shell: pwsh
        working-directory: ${{ env.CTS_DIR }}
        run: |
          .\deqp-vk.exe "--deqp-archive-dir=${env:CTS_DIR}" "--deqp-caselist-file=${env:CTS_DIR}\slang-passing-tests.txt" "--deqp-waiver-file=${env:CTS_DIR}\slang-waiver-tests.xml"

      - name: Upload TestResults.qpa if failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vkcts-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CTS_DIR }}/TestResults.qpa
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: success notification
        id: slack-notify-success
        if: ${{ github.event_name == 'schedule' && success() }}
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "CTS-Nightly": ":green-check-mark: CTS nightly status: ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: failure notification
        id: slack-notify-failure
        if: ${{ github.event_name == 'schedule' && !success() }}
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "CTS-Nightly": ":alert: :alert: :alert: :alert: :alert: :alert:\nCTS nightly status: ${{ job.status }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
