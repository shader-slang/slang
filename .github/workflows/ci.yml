# Temporary reproduction harness for #14504. Restore the full CI workflow
# before this PR is ready to merge.
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-release-gcc-wasm:
    uses: ./.github/workflows/ci-slang-build.yml
    permissions:
      id-token: write
      contents: read
      packages: read
    with:
      os: linux
      compiler: gcc
      platform: wasm
      build-llvm: false
      config: release
      # Reproduce on a fresh VM in the pool that had the original failure.
      runs-on: '["Linux", "self-hosted", "build", "GCP"]'
