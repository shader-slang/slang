name: Check GitHub Actions Workflows

# actionlint is invoked bare below, so it discovers and lints exactly
# .github/workflows/*.yml, using .github/actionlint.yaml as its config. Its
# verdict therefore cannot be changed by a PR that touches nothing else, so the
# pull_request paths: filter below keeps it off the majority of PRs, freeing a
# GitHub-hosted runner slot against the org's concurrency cap.
#
# There is deliberately no merge_group trigger: this check is not a required
# status check, so a failure in the queue would not block the merge, and the run
# would be discarded with the temporary gh-readonly-queue branch. Its result is
# also per-file -- a PR merging ahead in the queue cannot change it -- so the
# re-run would add nothing. If this ever becomes a required check, it needs the
# merge_group trigger back AND the paths: filter replaced by an in-job early-out
# (see ci.yml's filter job), because a path-skipped required check never reports
# and blocks the PR forever.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          version="${ACTIONLINT_VERSION#v}"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"

          mkdir -p "$install_dir"
          cd "$install_dir"

          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${archive}"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${version}_checksums.txt"
          grep "  ${archive}$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive"
          ./actionlint -version

      - name: Run actionlint
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" -config-file .github/actionlint.yaml -shellcheck= -no-color
