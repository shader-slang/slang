name: CMake Options

# Verifies that each CMake option compiles successfully when set to its
# non-default value (one option changed at a time, all others at their
# defaults). This is "depth-1" coverage: no multi-option combinations are
# tested.

on:
  workflow_dispatch:
  # The merge_group trigger was removed because the 10-job matrix consumed
  # half of the org's 20-runner GitHub-hosted budget per merge-queue attempt,
  # starving every other workflow (including CI gate jobs) for hours when the
  # merge queue had multiple entries lined up. Weekly Saturday coverage is
  # retained; ad-hoc validation is available via workflow_dispatch.
  schedule:
    - cron: "0 8 * * 6" # Saturday 12:00 AM PST (UTC-8)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  linux-debug:
    uses: ./.github/workflows/cmake-options-build-container.yml
    with:
      config: debug
      runs-on: '["ubuntu-22.04"]'

  linux-release:
    uses: ./.github/workflows/cmake-options-build-container.yml
    with:
      config: release
      runs-on: '["ubuntu-22.04"]'

  linux-aarch64-debug:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: linux
      compiler: gcc
      platform: aarch64
      config: debug
      runs-on: '["ubuntu-24.04-arm"]'

  linux-aarch64-release:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: linux
      compiler: gcc
      platform: aarch64
      config: release
      runs-on: '["ubuntu-24.04-arm"]'

  macos-debug:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: macos
      compiler: clang
      platform: aarch64
      config: debug
      runs-on: '["macos-latest"]'

  macos-release:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: macos
      compiler: clang
      platform: aarch64
      config: release
      runs-on: '["macos-latest"]'

  windows-aarch64-debug:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: windows
      compiler: cl
      platform: aarch64
      config: debug
      runs-on: '["windows-latest"]'
      arch: "amd64_arm64"

  windows-aarch64-release:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: windows
      compiler: cl
      platform: aarch64
      config: release
      runs-on: '["windows-latest"]'
      arch: "amd64_arm64"

  # windows-vs2019-debug: disabled — windows-2019 runner is being retired (June 2025)
  # windows-vs2019-release: disabled — windows-2019 runner is being retired (June 2025)

  windows-vs2022-debug:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: windows
      compiler: cl
      platform: x86_64
      config: debug
      runs-on: '["windows-2022"]'
      buildtool: "Visual Studio 17 2022"

  windows-vs2022-release:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: windows
      compiler: cl
      platform: x86_64
      config: release
      runs-on: '["windows-2022"]'
      buildtool: "Visual Studio 17 2022"

  windows-vs2026-debug:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: windows
      compiler: cl
      platform: x86_64
      config: debug
      runs-on: '["windows-2025-vs2026"]'
      buildtool: "Visual Studio 18 2026"

  windows-vs2026-release:
    uses: ./.github/workflows/cmake-options-build.yml
    with:
      os: windows
      compiler: cl
      platform: x86_64
      config: release
      runs-on: '["windows-2025-vs2026"]'
      buildtool: "Visual Studio 18 2026"

  check-cmake:
    needs:
      [
        linux-debug,
        linux-release,
        linux-aarch64-debug,
        linux-aarch64-release,
        macos-debug,
        macos-release,
        windows-aarch64-debug,
        windows-aarch64-release,
        windows-vs2022-debug,
        windows-vs2022-release,
        windows-vs2026-debug,
        windows-vs2026-release,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI Results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "=== CMake Options CI Results ==="
          echo "$results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more CMake option builds failed or were cancelled"
            exit 1
          fi
          echo "All CMake option builds completed successfully!"

      - name: success notification
        id: slack-notify-success
        if: ${{ github.event_name == 'schedule' && success() }}
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "CMake-Options-Weekly": ":green-check-mark: CMake options weekly status: ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # TODO: Re-enable the failure notification once this weekly workflow has
      # proven stable enough that a failure means a real regression. Until
      # then we only post the success message, so an infrastructure hiccup
      # does not advertise a false failure to the channel.
      # - name: failure notification
      #   id: slack-notify-failure
      #   if: ${{ github.event_name == 'schedule' && !success() }}
      #   uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
      #   with:
      #     payload: |
      #       {
      #         "CMake-Options-Weekly": ":alert: :alert: :alert: :alert: :alert: :alert:\nCMake options weekly status: ${{ job.status }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      #       }
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
