name: CI Container Test Workflow

on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      server-count:
        required: false
        type: number
        default: 4
      runs-on:
        required: false
        type: string
        # Require the "GCP" label so these jobs run only on the GCP
        # scaler-managed pool, never on the nvrgfx Colossus hosts that share
        # the "Linux, self-hosted, GPU" label set. See extras/scaler.
        default: '["Linux", "self-hosted", "GPU", "GCP"]'
      gpu-tier:
        required: false
        type: string
        default: t4
      enable-debug-layers:
        required: false
        type: boolean
        default: true

jobs:
  # Run GPU tests in container with Vulkan and CUDA support.
  #
  # Vulkan ICD: We use libEGL_nvidia.so.0 as the Vulkan ICD instead of the
  # default libGLX_nvidia.so.0 to avoid an intermittent crash in the EGL
  # initialization path of driver 580.x. Both libraries export vk_icd* symbols.
  # The default ICD causes the driver to load libEGL_nvidia.so via libglvnd's
  # EGL vendor dispatch, which has a null-deref bug that crashes test-server
  # processes. Using libEGL_nvidia directly as the ICD skips the EGL vendor
  # dispatch entirely, so the buggy code path is never reached.
  test-slang:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60

    permissions:
      contents: read
      packages: read # CI container images are public, so this is not strictly required; kept for consistency and in case they revert to private

    container:
      image: ghcr.io/shader-slang/slang-linux-gpu-ci:v1.6.1
      options: >-
        --gpus all
        --user root
        --cap-add SYSLOG
        ${{ inputs.gpu-tier == 't4' && '--device /dev/nvidia-modeset:/dev/nvidia-modeset' || '' }}
        --device /dev/dri:/dev/dri
        -e NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
        -v /usr/share/nvidia:/usr/share/nvidia:ro
        -v /var/cores:/var/cores

    defaults:
      run:
        shell: bash

    steps:
      - name: GPU health check
        run: |
          if ! output=$(nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader 2>&1); then
            echo "nvidia-smi output: $output"
            echo "::error::GPU health check failed — this VM has a faulty GPU. Re-run to get a new VM."
            exit 1
          fi
          echo "GPU: $output"

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: "false"
          fetch-depth: "1"

      - name: Clean inherited checkout state
        run: |
          # Remove stale files and stale submodule worktrees inherited by self-hosted runners.
          git submodule deinit --all --force
          git clean -ffdx
          git reset --hard HEAD

      - name: Checkout OptiX headers
        run: |
          git submodule sync -- external/optix-dev
          git submodule update --init --depth=1 external/optix-dev

      - name: Setup Vulkan ICD
        uses: ./.github/actions/setup-vulkan-icd

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: slang-tests-linux-x86_64-gcc-${{ inputs.config }}
          path: artifacts

      - name: Setup test environment
        run: |
          if [[ "${{ inputs.config }}" == "release" ]]; then
            cmake_config="Release"
          else
            cmake_config="Debug"
          fi
          echo "cmake_config=$cmake_config" >> $GITHUB_ENV

          bin_dir="$PWD/artifacts/${cmake_config}/bin"
          echo "bin_dir=$bin_dir" >> $GITHUB_ENV

          chmod +x "$bin_dir"/* 2>/dev/null || true
          echo "LD_LIBRARY_PATH=$PWD/artifacts/${cmake_config}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

          # Display environment configuration
          print-env-info

      # Cores are written to /var/cores by kernel.core_pattern (set in the
      # scaler's startup.sh on the host before this container started).
      # /var/cores is bind-mounted in via container.options. gdb is baked
      # into the container image so the post-test step can extract backtraces.

      # TEMPORARY: repro loop for https://github.com/shader-slang/slang/issues/11147.
      # Runs only the reported test signature (tests/compute/parameter-block.slang,
      # -api vk) in a tight repeat loop instead of the normal full suite, so the
      # intermittent bindAsValue assert gets many more chances to fire per CI run.
      # Core capture below is unchanged, so a crash here still produces a
      # backtrace artifact with the BindingType value from slang-rhi#842.
      # This step (and the two GPU-tier-conditional steps below it) must be
      # reverted before this branch is allowed to merge.
      - name: Test Slang (repro loop for #11147)
        if: inputs.gpu-tier == 't4'
        run: |
          ulimit -c unlimited
          export SLANG_RUN_SPIRV_VALIDATION=1
          export SLANG_USE_SPV_SOURCE_LANGUAGE_UNKNOWN=1

          fail_count=0
          for i in $(seq 1 300); do
            echo "=== repro attempt $i/300 ==="
            if ! "$bin_dir/slang-test" tests/compute/parameter-block.slang \
              -api vk \
              -expected-failure-list tests/expected-failure-github.txt \
              -expected-failure-list tests/expected-failure-linux.txt \
              -expected-failure-list tests/expected-failure-linux-gpu.txt \
              -skip-reference-image-generation \
              -show-adapter-info; then
              fail_count=$((fail_count + 1))
              echo "::warning::repro attempt $i failed"
            fi
          done
          echo "Completed 300 attempts, $fail_count failed."
          exit 0

      - name: Check slang-test worktree cleanliness
        if: always()
        run: |
          status="$(git status --short --untracked-files=all -- . ':(exclude)artifacts/**')"
          if [[ -n "$status" ]]; then
            echo "::error::slang-test left generated or modified files in the worktree"
            printf '%s\n' "$status"
            exit 1
          fi

      # TEMPORARY: disabled for the #11147 repro loop (unrelated to the repro,
      # skipped to keep CI time down). Revert before merge.
      - name: Run slangc tests
        if: false
        run: |
          ulimit -c unlimited
          PATH=$bin_dir:$PATH tools/slangc-test/test.sh

      # TEMPORARY: disabled for the #11147 repro loop. Revert before merge.
      - name: Test Slang via glsl
        if: false
        run: |
          ulimit -c unlimited
          export SLANG_RUN_SPIRV_VALIDATION=1
          export SLANG_USE_SPV_SOURCE_LANGUAGE_UNKNOWN=1
          "$bin_dir/slang-test" \
            -use-test-server \
            -server-count ${{ inputs.server-count }} \
            -emit-spirv-via-glsl \
            -api vk \
            -skip-list tests/skip-list-gpu-t4.txt \
            -expected-failure-list tests/expected-failure-via-glsl.txt \
            -expected-failure-list tests/expected-failure-github.txt \
            -expected-failure-list tests/expected-failure-linux.txt \
            -expected-failure-list tests/expected-failure-linux-gpu.txt

      - name: Check via-glsl slang-test worktree cleanliness
        if: always() && inputs.gpu-tier == 't4' && inputs.config == 'release' && github.event_name == 'pull_request'
        run: |
          status="$(git status --short --untracked-files=all -- . ':(exclude)artifacts/**')"
          if [[ -n "$status" ]]; then
            echo "::error::slang-test left generated or modified files in the worktree"
            printf '%s\n' "$status"
            exit 1
          fi

      # Extract gdb backtraces from any cores written to /var/cores during
      # the test steps above. /var/cores lives on the host (bind-mounted in
      # via container.options) and is configured by the scaler startup
      # script's `kernel.core_pattern` write.
      - name: Capture core dump backtraces
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          # Drop known-benign cores from intentional unit-test crashes
          # (test-process exercises subprocess management; gfx-smoke fails
          # to load a GPU driver in some configurations). Keeps the artifact
          # focused on real crashes.
          for benign in test-process gfx-smoke; do
            rm -f "/var/cores/core.$benign".*
          done
          cores=(/var/cores/core.*)
          if [ "${#cores[@]}" -eq 0 ]; then
            echo "No interesting core dumps captured."
            exit 0
          fi
          echo "Captured ${#cores[@]} core dump(s):"
          ls -lh "${cores[@]}"
          mkdir -p backtraces
          for c in "${cores[@]}"; do
            name=$(basename "$c")
            exe_name=${name#core.}
            exe_name=${exe_name%.*}
            exe_path="$bin_dir/$exe_name"
            if [ ! -x "$exe_path" ]; then
              exe_path=""
            fi
            bt_file="backtraces/$name.bt.txt"
            echo "=== Backtrace for $name (exe=$exe_path) ===" | tee "$bt_file"
            gdb -batch \
              -ex "set pagination off" \
              -ex "set print pretty on" \
              -ex "thread apply all bt full" \
              -ex "info registers" \
              -ex "x/i \$pc" \
              -ex "x/16i \$pc-32" \
              -ex "info sharedlibrary" \
              -ex "maintenance info sections" \
              ${exe_path:+"$exe_path"} "$c" 2>&1 | tee -a "$bt_file" || true
          done

      # Upload only the gdb-extracted backtraces, not raw cores. Raw cores
      # contain full process memory which can include credentials or other
      # sensitive in-memory state.
      - name: Upload core dump backtraces
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cores-test-slang-${{ inputs.config }}-${{ inputs.gpu-tier }}
          path: backtraces/
          if-no-files-found: ignore
          retention-days: 7

      - name: GPU post-test diagnostics
        if: failure()
        run: |
          gpu_crashed=0
          echo "=== GPU State ==="
          if ! nvidia-smi 2>&1; then
            echo "nvidia-smi FAILED (GPU may have crashed)"
            echo "::error::GPU crashed during tests — retrying may help."
            gpu_crashed=1
          fi
          echo ""
          echo "=== GPU Memory & ECC ==="
          nvidia-smi --query-gpu=name,driver_version,memory.used,memory.free,temperature.gpu,ecc.errors.uncorrected.volatile.total,pstate \
            --format=csv,noheader 2>&1 || true
          echo ""
          echo "=== XID Errors ==="
          nvidia-smi -q -d XID_ERRORS 2>&1 || true
          echo ""
          echo "=== GPU Process State ==="
          nvidia-smi pmon -c 1 2>&1 || true
          echo ""
          echo "=== Kernel GPU Messages ==="
          dmesg 2>/dev/null | grep -iE "nvidia|nvrm|xid|gpu|fault|segfault" | tail -50 || \
          sudo dmesg 2>/dev/null | grep -iE "nvidia|nvrm|xid|gpu|fault|segfault" | tail -50 || \
          echo "(dmesg not available in container)"
          if [[ "$gpu_crashed" -eq 1 ]]; then
            exit 1
          fi
