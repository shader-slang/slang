name: CI Test Workflow

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      compiler:
        required: true
        type: string
      platform:
        required: true
        type: string
      config:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      full-gpu-tests:
        required: false
        type: boolean
        default: false
      server-count:
        required: false
        type: number
        default: 8
      enable-debug-layers:
        required: false
        type: boolean
        default: true
      artifact-suffix:
        required: false
        type: string
        default: ""
        description: "Optional suffix for artifact name (e.g., '-cuda')"
      slang-user-skills:
        required: false
        type: boolean
        default: false
        description: "Validate the bundled Slang user skills and their examples"
      gpu-tier:
        required: false
        type: string
        default: ""
        description: "GPU tier of the runner: 't4', 'sm80plus', or 'nogpu' (no GPU). Empty runs all tests. It chooses the tests that the job runs."

jobs:
  test-slang:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      # Ensure Git Bash tools are in PATH for Windows.
      # Needed by pre-setup Bash steps before common-test-setup adds them.
      - name: Add Git Bash to PATH (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\\Program Files\\Git\\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\\Program Files\\Git\\usr\\bin"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          submodules: "false"
          fetch-depth: "1"

      - name: Clean inherited checkout state
        run: |
          # Remove stale files and stale submodule worktrees inherited by self-hosted runners.
          git submodule deinit --all --force
          git clean -ffdx
          git reset --hard HEAD

      - name: Checkout OptiX headers
        if: inputs.full-gpu-tests && inputs.os != 'macos'
        run: |
          git submodule sync -- external/optix-dev
          git submodule update --init --depth=1 external/optix-dev

      - name: Checkout Slang user skills
        if: inputs.slang-user-skills
        run: |
          git submodule sync -- external/slang-user-skills
          git submodule update --init --depth=1 external/slang-user-skills

      - name: Test user-skills package verifier
        if: inputs.slang-user-skills
        run: python3 extras/tests/test_verify_user_skills_package.py

      - name: Common Test Setup
        uses: ./.github/actions/common-test-setup
        with:
          os: ${{ inputs.os }}
          compiler: ${{ inputs.compiler }}
          platform: ${{ inputs.platform }}
          config: ${{ inputs.config }}
          artifact-suffix: ${{ inputs.artifact-suffix }}
          gpu-tier: ${{ inputs.gpu-tier }}

      - name: Validate Slang user-skill examples
        if: inputs.slang-user-skills
        run: >-
          python3 external/slang-user-skills/scripts/validate-examples.py
          --slangc "$bin_dir/slangc"

      # slang-test's CUDA pass-through compiles through NVRTC, so the
      # offline (non-NVRTC) branch of the prelude is never compiled by the
      # test suite. Compile it here: the guarded regressions are type
      # errors, so compiling is the whole test. -std pins the language
      # mode against toolkit-default drift. -arch pins compute_80: the
      # fixture enables the half/bf16/fp8 prelude sections, whose
      # intrinsics need __CUDA_ARCH__ >= 530 (fp16) / 800 (bf16); nvcc's
      # default sm_52 has neither. Compile-only, so any arch works.
      - name: Compile offline (non-NVRTC) CUDA prelude test
        if: inputs.os == 'windows' && inputs.full-gpu-tests
        run: >-
          nvcc -std=c++17 -arch=compute_80 -c tests/cuda/cuda-prelude-vec1-make.cu
          -I prelude -o "${{ runner.temp }}/cuda-prelude-vec1-make.obj"

      - name: Test Slang
        run: |
          # SPIR-V emission / validation don't need a GPU — keep on all tiers.
          export SLANG_RUN_SPIRV_VALIDATION=1
          export SLANG_USE_SPV_SOURCE_LANGUAGE_UNKNOWN=1
          # Vulkan runtime validation needs a Vulkan device; skip on CPU tier.
          if [[ "${{ inputs.gpu-tier }}" != "nogpu" && "${{ inputs.enable-debug-layers }}" == "true" ]]; then
            export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          fi
          # Force AVX-512 off in slang-llvm's JIT TargetMachine. We have observed
          # intermittent illegal-instruction failures on both GitHub-hosted and
          # GCP VMs, indicating that LLVM's host-detection path can mis-report
          # AVX-512 support on virtual machines generally. Apply the workaround
          # to every test tier so JIT-emitted kmovd / vmovss-with-mask instructions
          # cannot fault when the reported features exceed the host capabilities
          # (#11062).
          # Drop this once the LLVM 22 bump (#11017) fixes the underlying
          # detection.
          export SLANG_DISABLE_AVX512=1
          # Build common slang-test arguments
          slang_test_args=(
            "-expected-failure-list" "tests/expected-failure-github.txt"
            "-skip-reference-image-generation"
            "-show-adapter-info"
            "-enable-debug-layers" "${{ inputs.enable-debug-layers }}"
          )

          # slang-test accepts only a single -api option (a later one silently
          # overrides an earlier one), so select exactly one expression.
          # "-api all" is equivalent to the default (all APIs enabled).
          case "${{ inputs.gpu-tier }}" in
            nogpu)
              # Restrict to CPU / LLVM backends; tests requiring any GPU API get
              # ignored by the test filter rather than run-and-failed. The
              # compile tests (the tests that use no API, such as SIMPLE) and
              # the unit tests that need no GPU run here, and on macOS: the GPU
              # tiers use -compile-test false.
              api_expr="cpu+llvm"
              slang_test_args+=("-compile-test" "true" "-api-only")
              ;;
            t4 | sm80plus)
              # The GPU tiers run the same way, and differ only in which tests
              # they select (see below). Restrict to GPU APIs ("all" without
              # cpu and llvm, where llvm is the tests that use
              # -emit-cpu-via-llvm) so (cpu) / (llvm) tests are skipped, and use
              # -compile-test false so the compile tests (the tests that use no
              # API, such as SIMPLE) and the unit tests that need no GPU are
              # skipped too: the nogpu jobs run them. -compile-test false keeps
              # the COMPILE lines that prepare the input of a GPU test in the
              # same file (for example a COMPILE line before a COMPARE_COMPUTE
              # line), the lines that need NVRTC, and the unit tests that
              # declare a GPU API.
              api_expr="all-cpu-llvm"
              slang_test_args+=("-compile-test" "false" "-api-only")
              if [[ "${{ inputs.gpu-tier }}" == "t4" ]]; then
                # T4 runners cannot execute SM 8.0+ cooperative matrix / neural
                # tests.
                slang_test_args+=("-exclude-list" "tests/tests-require-sm80.txt")
              else
                # Keep the SM80 cost bounded: run only the tests that T4 cannot.
                slang_test_args+=("-include-list" "tests/tests-require-sm80.txt")
              fi
              # tests/expected-failure-linux-gpu.txt lists failures of the Linux
              # GPU machines, so it applies only to Linux jobs.
              if [[ "${{ inputs.os }}" == "linux" ]]; then
                slang_test_args+=("-expected-failure-list" "tests/expected-failure-linux-gpu.txt")
              fi
              ;;
            "")
              # No tier: no nogpu job runs on this OS (macOS), so the job runs
              # everything that the machine supports: Metal, the (cpu) / (llvm)
              # tests, and the compile tests (the tests that use no API).
              api_expr="all"
              slang_test_args+=("-compile-test" "true" "-api-only")
              ;;
            *)
              echo "::error::unknown gpu-tier '${{ inputs.gpu-tier }}' (expected t4, sm80plus or nogpu)"
              exit 1
              ;;
          esac

          slang_test_args+=("-api" "$api_expr")

          # Add test server arguments only if server count > 1
          if [ "${{ inputs.server-count }}" -gt 1 ]; then
            slang_test_args+=("-use-test-server")
            slang_test_args+=("-server-count" "${{ inputs.server-count }}")
          fi

          # Add no-GPU failure list for non-GPU tests
          if [[ "${{ inputs.full-gpu-tests }}" != "true" ]]; then
            slang_test_args+=("-expected-failure-list" "tests/expected-failure-no-gpu.txt")
          fi

          # Add known failures on Linux regardless GPU presence
          if [[ "${{ inputs.os }}" == "linux" ]]; then
            slang_test_args+=("-expected-failure-list" "tests/expected-failure-linux.txt")
          fi


          # Skip most neural tests in debug builds to reduce CI time
          if [[ "${{ inputs.config }}" == "debug" ]]; then
            slang_test_args+=("-skip-list" "tests/skip-list-debug.txt")
          fi

          # Execute slang-test with all arguments. Print the fully-resolved
          # command first so the CI log shows exactly which arguments were used
          # (the conditional logic above only shows the source, not the result).
          printf '+ %q' "$bin_dir/slang-test"
          printf ' %q' "${slang_test_args[@]}"
          printf '\n'

          "$bin_dir/slang-test" "${slang_test_args[@]}"

      - name: Check slang-test worktree cleanliness
        if: always()
        run: |
          status="$(git status --short --untracked-files=all -- . ':(exclude)github_artifact/**')"
          if [[ -n "$status" ]]; then
            echo "::error::slang-test left generated or modified files in the worktree"
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Run Slang examples
        # Run examples on release for pull requests, and not on merge_group, to reduce CI load.
        if: inputs.full-gpu-tests && inputs.config == 'release' && github.event_name == 'pull_request'
        run: |
          .github/workflows/ci-examples.sh \
           --bin-dir "$bin_dir" \
           --os "${{ inputs.os }}" \
           --platform "${{ inputs.platform }}" \
           --config "${{ inputs.config }}" \
           --skip-file tests/expected-example-failure-github.txt
      # The slangc tests need no GPU, so the CPU-only jobs run them, and the jobs
      # that run only the GPU APIs do not.
      - name: Run slangc tests
        if: inputs.gpu-tier == '' || inputs.gpu-tier == 'nogpu'
        run: |
          PATH=$bin_dir:$PATH tools/slangc-test/test.sh
