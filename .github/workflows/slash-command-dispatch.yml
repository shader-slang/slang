name: Slash Command Dispatch
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  # The reaction and the error reply are written with this token. Only
  # `pull-requests: write` may be needed, because the commands apply to pull
  # requests only; `issues: write` is kept until a run confirms that.
  issues: write
  pull-requests: write
jobs:
  slashCommandDispatch:
    if: github.repository == 'shader-slang/slang'
    runs-on: ubuntu-latest
    steps:
      - name: Slash Command Dispatch
        id: scd
        uses: peter-evans/slash-command-dispatch@9bdcd7914ec1b75590b790b844aa3b8eee7c683a # v5.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-type: pull-request
          config: >
            [
              {
                "command": "format",
                "permission": "write",
                "issue_type": "pull-request"
              },
              {
                "command": "regenerate-toc",
                "permission": "write",
                "issue_type": "pull-request"
              },
              {
                "command": "regenerate-cmdline-ref",
                "permission": "write",
                "issue_type": "pull-request"
              }
            ]

      - name: Reply with error message
        if: steps.scd.outputs.error-message
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            > ${{ steps.scd.outputs.error-message }}
