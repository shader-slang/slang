name: Seed all LLVM prebuilts (manual)

on:
  workflow_dispatch:

concurrency:
  group: llvm-prebuilt-seed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    name: LLVM ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # A native Windows ARM64 LLVM build can take nearly two hours by itself.
    # Allow roughly twice that time for runner variance, compression, and staging.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            compiler: gcc
            platform: x86_64
            runner: ubuntu-22.04
          - os: linux
            compiler: gcc
            platform: aarch64
            runner: ubuntu-24.04-arm
          # The WASM job builds host LLVM, but requests its own cache key.
          - os: linux
            compiler: gcc
            platform: wasm
            runner: ubuntu-22.04
          - os: macos
            compiler: clang
            platform: aarch64
            runner: macos-latest
          - os: windows
            compiler: cl
            platform: x86_64
            runner: windows-2022
          - os: windows
            compiler: cl
            platform: aarch64
            runner: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up native build tools
        uses: ./.github/actions/common-setup
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
          platform: ${{ matrix.platform }}
          config: release
          build-llvm: false

      - name: Restore or build LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm-from-gcs
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
          platform: ${{ matrix.platform }}
          llvm-hash: ${{ hashFiles('external/build-llvm.sh', 'external/llvm-*.patch') }}
          upload-if-missing: "false"

      - name: Validate installed LLVM and Clang packages
        shell: bash
        run: |
          mkdir -p build/llvm-prebuilt-smoke
          cat > build/llvm-prebuilt-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(LLVMPrebuiltSmoke LANGUAGES C CXX)
          find_package(LLVM REQUIRED CONFIG)
          find_package(Clang REQUIRED CONFIG)
          add_executable(llvm-prebuilt-smoke main.cpp)
          # Match the pinned LLVM release's minimum language standard.
          target_compile_features(llvm-prebuilt-smoke PRIVATE cxx_std_17)
          target_include_directories(llvm-prebuilt-smoke PRIVATE ${LLVM_INCLUDE_DIRS})
          target_link_libraries(llvm-prebuilt-smoke PRIVATE LLVMSupport)
          EOF
          cat > build/llvm-prebuilt-smoke/main.cpp <<'EOF'
          #include <llvm/Support/raw_ostream.h>
          int main() { llvm::outs() << "LLVM prebuilt works\n"; }
          EOF
          cmake -S build/llvm-prebuilt-smoke -B build/llvm-prebuilt-smoke/native \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' \
            "-DCMAKE_PREFIX_PATH=$(pwd)/build/llvm-project-install"
          cmake --build build/llvm-prebuilt-smoke/native
          build/llvm-prebuilt-smoke/native/llvm-prebuilt-smoke

      - name: Validate Linux prebuilt in the Slang CI container
        if: matrix.os == 'linux' && (matrix.platform == 'x86_64' || matrix.platform == 'wasm')
        shell: bash
        run: |
          # Use the consumer image from ci-slang-build-container.yml rather
          # than trusting optional packages installed on the native builder.
          docker run --rm --volume "$(pwd):/workspace" --workdir /workspace \
            ghcr.io/shader-slang/slang-linux-gpu-ci:v1.7.0 bash -c '
              cmake -S build/llvm-prebuilt-smoke -B build/llvm-prebuilt-smoke/container \
                -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/workspace/build/llvm-project-install &&
              cmake --build build/llvm-prebuilt-smoke/container &&
              build/llvm-prebuilt-smoke/container/llvm-prebuilt-smoke
            '

      - name: Archive new prebuilt
        if: steps.llvm.outputs.cache-hit != 'true'
        id: archive
        shell: bash
        env:
          LLVM_KEY: llvm-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.platform }}-${{ hashFiles('external/build-llvm.sh', 'external/llvm-*.patch') }}
        run: |
          # Match setup-llvm-from-gcs's key and restore layout: archive the
          # install contents directly, without an enclosing directory.
          # Slang's CMake configuration requires both installed packages.
          test -f build/llvm-project-install/lib/cmake/llvm/LLVMConfig.cmake
          test -f build/llvm-project-install/lib/cmake/clang/ClangConfig.cmake
          archive_path="${RUNNER_TEMP}/${LLVM_KEY}.tar.gz"
          tar_path="$archive_path"
          # Git Bash's GNU tar interprets a Windows drive-letter colon as a
          # remote archive. Keep the native path for upload-artifact below.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            tar_path=$(cygpath -u "$archive_path")
          fi
          tar -czf "$tar_path" -C build/llvm-project-install .
          tar -tzf "$tar_path" > /dev/null
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Stage new prebuilt for publication
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: llvm-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.platform }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-llvm:
    needs: build
    # Publish successful platforms even if another platform's cold build fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download new prebuilts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: llvm-*
          path: llvm-prebuilts
          merge-multiple: true

      - name: Check for new prebuilts
        id: archives
        shell: bash
        run: |
          shopt -s nullglob
          archives=(llvm-prebuilts/*.tar.gz)
          if [ "${#archives[@]}" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No completed LLVM archives are available to publish."
          fi

      # Upload from Ubuntu so native builders, including Windows ARM64, do not
      # need the Cloud SDK. Authenticate after the hours-long builds finish.
      - name: Authenticate to Google Cloud
        if: steps.archives.outputs.found == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/125098404903/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-ci@slang-runners.iam.gserviceaccount.com"

      - name: Set up Google Cloud SDK
        if: steps.archives.outputs.found == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish and verify new prebuilts
        if: steps.archives.outputs.found == 'true'
        shell: bash
        run: |
          gcloud config set storage/parallel_composite_upload_enabled False
          for archive in llvm-prebuilts/*.tar.gz; do
            filename=$(basename "$archive")
            gcloud storage cp "$archive" "gs://slang-ci-cache/llvm-prebuilts/${filename}"
            published_archive="${RUNNER_TEMP}/published-${filename}"
            curl --fail --location --retry 3 --retry-delay 5 --output "$published_archive" \
              "https://storage.googleapis.com/slang-ci-cache/llvm-prebuilts/${filename}"
            cmp "$archive" "$published_archive"
            rm "$published_archive"
          done

      - name: Require all missing platforms to finish
        if: needs.build.result != 'success'
        shell: bash
        run: |
          echo "Some LLVM builds failed; completed archives were published, but LLVM population is incomplete."
          exit 1
