name: Validate cached LLVM in both Linux CI containers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: LLVM ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # A native Windows ARM64 LLVM build can take nearly two hours by itself.
    # Allow roughly twice that time for runner variance, compression, and staging.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            compiler: gcc
            platform: x86_64
            runner: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}

      - name: Set up native build tools
        uses: ./.github/actions/common-setup
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
          platform: ${{ matrix.platform }}
          config: release
          build-llvm: false

      # Match the oldest Windows x64 consumer; a newer MSVC library can
      # require standard-library symbols absent from that consumer's toolset.
      - name: Select Windows x64 consumer toolset
        if: matrix.os == 'windows' && matrix.platform == 'x86_64'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          arch: x64
          toolset: 14.43

      - name: Verify Windows x64 consumer toolset
        if: matrix.os == 'windows' && matrix.platform == 'x86_64'
        shell: pwsh
        run: |
          if ($env:VCToolsVersion -notlike '14.43.*') {
            throw "Expected MSVC 14.43, found $env:VCToolsVersion"
          }
          Write-Output "LLVM producer MSVC: $env:VCToolsVersion"

      - name: Restore or build LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm-from-gcs
        with:
          os: ${{ matrix.os }}
          compiler: ${{ matrix.compiler }}
          platform: ${{ matrix.platform }}
          llvm-hash: ${{ hashFiles('external/build-llvm.sh', 'external/llvm-*.patch') }}
          upload-if-missing: "false"

      - name: Validate installed LLVM and Clang packages
        shell: bash
        run: |
          mkdir -p build/llvm-prebuilt-smoke
          cat > build/llvm-prebuilt-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(LLVMPrebuiltSmoke LANGUAGES C CXX)
          find_package(LLVM REQUIRED CONFIG)
          find_package(Clang REQUIRED CONFIG)
          add_executable(llvm-prebuilt-smoke main.cpp)
          # Match the pinned LLVM release's minimum language standard.
          target_compile_features(llvm-prebuilt-smoke PRIVATE cxx_std_17)
          target_include_directories(llvm-prebuilt-smoke PRIVATE ${LLVM_INCLUDE_DIRS})
          llvm_config(llvm-prebuilt-smoke ${LLVM_TARGETS_TO_BUILD}
            core support filecheck orcjit codegen mc mcparser)
          target_link_libraries(llvm-prebuilt-smoke PRIVATE
            clangBasic clangCodeGen clangDriver clangLex clangFrontend clangFrontendTool)
          EOF
          cat > build/llvm-prebuilt-smoke/main.cpp <<'EOF'
          #include <llvm/Support/raw_ostream.h>
          #include <llvm/Support/TargetSelect.h>
          #include <clang/Basic/Version.h>
          int main()
          {
              llvm::InitializeAllTargetMCs();
              llvm::outs() << clang::getClangFullVersion() << "\n";
          }
          EOF
          cmake -S build/llvm-prebuilt-smoke -B build/llvm-prebuilt-smoke/native \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded' \
            "-DCMAKE_PREFIX_PATH=$(pwd)/build/llvm-project-install"
          cmake --build build/llvm-prebuilt-smoke/native
          build/llvm-prebuilt-smoke/native/llvm-prebuilt-smoke

      - name: Validate Linux prebuilt in both CI consumer containers
        if: matrix.os == 'linux' && matrix.platform == 'x86_64'
        shell: bash
        run: |
          # Match both consumers of the Linux GCC x64 archive: normal builds
          # and the Clang sanitizer build. Keep separate CMake build trees.
          for consumer in gpu clang; do
            case "$consumer" in
              gpu) image=ghcr.io/shader-slang/slang-linux-gpu-ci:v1.7.0; cc=gcc; cxx=g++ ;;
              clang) image=ghcr.io/shader-slang/slang-linux-clang-ci:v1.0.1; cc=clang; cxx=clang++ ;;
            esac
            docker run --rm --volume "$(pwd):/workspace" --workdir /workspace \
              --env "CC=$cc" --env "CXX=$cxx" --env "CONSUMER=$consumer" \
              "$image" bash -c '
                cmake -S build/llvm-prebuilt-smoke -B "build/llvm-prebuilt-smoke/$CONSUMER" \
                  -G Ninja -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_PREFIX_PATH=/workspace/build/llvm-project-install &&
                cmake --build "build/llvm-prebuilt-smoke/$CONSUMER" &&
                "build/llvm-prebuilt-smoke/$CONSUMER/llvm-prebuilt-smoke"
              '
          done
